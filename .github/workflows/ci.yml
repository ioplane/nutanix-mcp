name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reusable from release.yml — every tag push runs the full quality
  # gate before any artefact is built.
  workflow_call:
    secrets:
      PVS_USER:
        required: false
      PVS_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-unit-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore nutanix-mcp.slnx
      - name: Build (Release, warnings as errors)
        run: dotnet build nutanix-mcp.slnx --configuration Release --no-restore
      - name: Format check
        run: dotnet format nutanix-mcp.slnx --verify-no-changes --no-restore
      - name: Unit tests (no Pgvector collection)
        run: |
          dotnet test nutanix-mcp.slnx --configuration Release --no-build \
            --filter 'FullyQualifiedName!~NutanixMcp.Data.Tests&FullyQualifiedName!~NutanixMcp.Embedding.Tests'

  integration-test:
    name: integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: tensorchord/vchord-suite:pg18-latest@sha256:c6e5e77a1180199f91b040b6e85c6d10b0ded6d49fb614dfd2e7272ffb91af08
        env:
          POSTGRES_DB: nutanix
          POSTGRES_USER: nutanix
          POSTGRES_PASSWORD: nutanix
          POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF-8 --locale=C.UTF-8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutanix -d nutanix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Apply init.sql to default database
        run: |
          export PGPASSWORD=nutanix
          psql -h 127.0.0.1 -U nutanix -d nutanix -f docker/init.sql
      - name: Restore + build
        run: |
          dotnet restore nutanix-mcp.slnx
          dotnet build nutanix-mcp.slnx --configuration Release --no-restore
      - name: Data integration tests
        env:
          NUTANIX_MCP_TEST_CS: Host=127.0.0.1;Port=5432;Database=nutanix_test;Username=nutanix;Password=nutanix
        run: |
          dotnet test tests/NutanixMcp.Data.Tests/NutanixMcp.Data.Tests.csproj \
            --configuration Release --no-build --logger 'console;verbosity=normal'

  docs-lint:
    name: docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2
      - name: Lint Markdown
        run: markdownlint-cli2 '**/*.md' '#node_modules' '#bin' '#obj'

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Semgrep scan (auto rules, fail on blocking)
        run: |
          semgrep scan \
            --config=auto \
            --error \
            --no-git-ignore \
            --include='*.cs' \
            --exclude='**/obj/**' \
            --exclude='**/bin/**' \
            --exclude='**/Migrations/*.Designer.cs' \
            src/

  pvs-studio:
    name: pvs-studio (C#)
    runs-on: ubuntu-latest
    # Skip in forks/PRs that lack the license. Maintainer pushes to main
    # and dispatched runs see the secret and run the full scan.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Skip if license missing
        id: precheck
        env:
          PVS_USER: ${{ secrets.PVS_USER }}
          PVS_KEY: ${{ secrets.PVS_KEY }}
        run: |
          if [ -z "$PVS_USER" ] || [ -z "$PVS_KEY" ]; then
            echo "PVS-Studio license secrets not set — skipping job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install PVS-Studio
        if: steps.precheck.outputs.skip != 'true'
        run: |
          wget -q -O- https://files.pvs-studio.com/etc/pubkey.txt | sudo apt-key add -
          sudo wget -q -O /etc/apt/sources.list.d/viva64.list \
            https://files.pvs-studio.com/etc/viva64.list
          sudo apt-get update
          sudo apt-get install -y pvs-studio-dotnet
      - name: Configure license
        if: steps.precheck.outputs.skip != 'true'
        env:
          PVS_USER: ${{ secrets.PVS_USER }}
          PVS_KEY: ${{ secrets.PVS_KEY }}
        run: pvs-studio-dotnet credentials -u "$PVS_USER" -n "$PVS_KEY"
      - name: Build
        if: steps.precheck.outputs.skip != 'true'
        run: dotnet build nutanix-mcp.slnx --configuration Release
      - name: Analyze each project
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p pvs-out
          for proj in src/NutanixMcp.*/NutanixMcp.*.csproj; do
            name=$(basename "$proj" .csproj)
            pvs-studio-dotnet -t "$proj" -c Release -o "pvs-out/${name}.plog" || code=$?
            # Bit-mask: 256 = findings, 1024 = license expiring soon — both
            # tolerated.
            if [ -n "${code:-}" ] && [ $((code & ~256 & ~1024)) -ne 0 ]; then
              exit "$code"
            fi
            unset code
          done
      - name: Upload plog artifacts
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pvs-studio-plogs
          path: pvs-out/
