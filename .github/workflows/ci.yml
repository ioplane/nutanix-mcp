name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reusable from release.yml — every tag push runs the full quality
  # gate before any artefact is built.
  workflow_call:
    secrets:
      PVS_USER:
        required: false
      PVS_KEY:
        required: false

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name under workflow_call, so the ci gate
  # inside release.yml never cancels (or is cancelled by) a direct ci run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  build-and-unit-test:
    name: build + unit tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore nutanix-mcp.slnx
      - name: Build (Release, warnings as errors)
        run: dotnet build nutanix-mcp.slnx --configuration Release --no-restore
      - name: Format check
        run: dotnet format nutanix-mcp.slnx --verify-no-changes --no-restore
      # Microsoft.Testing.Platform mode (global.json "test.runner"): run the
      # unit projects by name. Filtering Data/Embedding out of the whole
      # solution would leave modules with zero tests, which MTP fails with
      # exit code 8.
      - name: Unit tests
        run: |
          set -euo pipefail
          for project in Core Server Cli; do
            dotnet test --project "tests/NutanixMcp.$project.Tests/NutanixMcp.$project.Tests.csproj" \
              --configuration Release --no-build
          done

  integration-test:
    name: integration tests (Postgres)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: tensorchord/vchord-suite:pg18-latest@sha256:c6e5e77a1180199f91b040b6e85c6d10b0ded6d49fb614dfd2e7272ffb91af08
        env:
          POSTGRES_DB: nutanix
          POSTGRES_USER: nutanix
          POSTGRES_PASSWORD: nutanix
          POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF-8 --locale=C.UTF-8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nutanix -d nutanix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Apply init.sql to default database
        run: |
          export PGPASSWORD=nutanix
          psql -h 127.0.0.1 -U nutanix -d nutanix -f docker/init.sql
      - name: Restore + build
        run: |
          dotnet restore nutanix-mcp.slnx
          dotnet build nutanix-mcp.slnx --configuration Release --no-restore
      - name: Data integration tests
        env:
          NUTANIX_MCP_TEST_CS: Host=127.0.0.1;Port=5432;Database=nutanix_test;Username=nutanix;Password=nutanix
        run: |
          dotnet test --project tests/NutanixMcp.Data.Tests/NutanixMcp.Data.Tests.csproj \
            --configuration Release --no-build

  docs-lint:
    name: docs lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@0.23.3
      - name: Lint Markdown
        run: markdownlint-cli2 '**/*.md' '#node_modules' '#bin' '#obj'

  semgrep:
    name: semgrep
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      # Digest-pinned semgrep/semgrep 1.180.0 (resolved 2026-10). Bump the digest
      # deliberately rather than tracking a moving :latest tag.
      image: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan (auto rules, fail on blocking)
        run: |
          semgrep scan \
            --config=auto \
            --error \
            --no-git-ignore \
            --include='*.cs' \
            --exclude='**/obj/**' \
            --exclude='**/bin/**' \
            --exclude='**/Migrations/*.Designer.cs' \
            src/

  pvs-studio:
    name: pvs-studio (C#)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Skip in forks/PRs that lack the license. Maintainer pushes to main
    # and dispatched runs see the secret and run the full scan.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Skip if license missing
        id: precheck
        env:
          PVS_USER: ${{ secrets.PVS_USER }}
          PVS_KEY: ${{ secrets.PVS_KEY }}
        run: |
          if [ -z "$PVS_USER" ] || [ -z "$PVS_KEY" ]; then
            echo "PVS-Studio license secrets not set — skipping job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install PVS-Studio
        if: steps.precheck.outputs.skip != 'true'
        run: |
          wget -q -O- https://files.pvs-studio.com/etc/pubkey.txt | sudo apt-key add -
          sudo wget -q -O /etc/apt/sources.list.d/viva64.list \
            https://files.pvs-studio.com/etc/viva64.list
          sudo apt-get update
          sudo apt-get install -y pvs-studio-dotnet
      - name: Configure license
        if: steps.precheck.outputs.skip != 'true'
        env:
          PVS_USER: ${{ secrets.PVS_USER }}
          PVS_KEY: ${{ secrets.PVS_KEY }}
        run: pvs-studio-dotnet credentials -u "$PVS_USER" -n "$PVS_KEY"
      - name: Build
        if: steps.precheck.outputs.skip != 'true'
        run: dotnet build nutanix-mcp.slnx --configuration Release
      - name: Analyze each project
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p pvs-out
          for proj in src/NutanixMcp.*/NutanixMcp.*.csproj; do
            name=$(basename "$proj" .csproj)
            pvs-studio-dotnet -t "$proj" -c Release -o "pvs-out/${name}.plog" || code=$?
            # pvs-studio-dotnet (Linux) bit-mask: 8 = findings, 4 = license
            # expiring within a month — both tolerated; 1 = license error,
            # 2 = analyzer error fail the job. (256/1024 are the Windows
            # PVS-Studio_Cmd codes.) https://pvs-studio.com/en/docs/manual/0035/
            if [ -n "${code:-}" ] && [ $((code & ~8 & ~4)) -ne 0 ]; then
              exit "$code"
            fi
            unset code
          done
      - name: Upload plog artifacts
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pvs-studio-plogs
          path: pvs-out/
