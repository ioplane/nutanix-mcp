name: release

# Release gate, adapted from gobfd:
#
#   1. ci-mirror     — reuses ci.yml in workflow_call mode (build + format
#                      + unit + integration + docs-lint + semgrep + pvs).
#   2. publish       — matrix x6 RIDs. dotnet publish single-file +
#                      self-contained. Per-artefact SBOM (CycloneDX + SPDX
#                      JSON via syft) + SHA-256 checksum. Read-only: the
#                      archives leave the job as workflow artefacts.
#   3. container     — multi-arch (linux/amd64,arm64) image on the
#                      Blacksmith builder. Keyless cosign signature. Push to
#                      ghcr.io/<owner>/nutanix-mcp:<tag> + :latest.
#   4. finalize      — extracts the [<tag>] block from CHANGELOG.md as
#                      release notes; updates the GitHub Release.
#
# Two paths share the build steps:
#   - tag push / workflow_dispatch: a real release.
#   - pull_request touching the release pipeline: a dry run that builds all
#     six archives and the image but cannot publish. Every job that writes
#     (create-release, upload-assets, container, corpus-dump, finalize) is
#     skipped on pull_request at job level, and the jobs that do run on a
#     pull request hold only `contents: read`.
#
# Tag format gate: only `v\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?` triggers a
# real release. Anything else fails the validate-tag step before any
# artefact is built.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - docker/Containerfile.app
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SYFT_VERSION: v1.54.1

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────
  # GATE 1 — full CI must pass before we build any release artefact.
  # ──────────────────────────────────────────────────────────────────
  ci-mirror:
    name: ci gate
    uses: ./.github/workflows/ci.yml
    # Only pass the secrets ci.yml actually reads (pvs-studio credentials).
    # `secrets: inherit` handed everything over and violated least-privilege
    # (semgrep p/security-audit rule secrets-inherit).
    secrets:
      PVS_USER: ${{ secrets.PVS_USER }}
      PVS_KEY: ${{ secrets.PVS_KEY }}
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────
  # Validate the tag format before we burn build minutes. A pull request
  # gets a synthetic pre-release version that only names artefacts.
  # ──────────────────────────────────────────────────────────────────
  validate-tag:
    name: validate tag
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Resolve and validate tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            candidate="v0.0.0-pr.${PR_NUMBER}"
          else
            candidate="${INPUT_TAG:-$REF_NAME}"
          fi
          if ! printf '%s' "$candidate" \
              | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
              printf 'invalid release tag: %q\n' "$candidate" >&2
              exit 1
          fi
          version="${candidate#v}"
          printf 'name=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────
  # Create the GitHub Release once, before any uploader runs.
  # ──────────────────────────────────────────────────────────────────
  create-release:
    name: create release
    needs: [ci-mirror, validate-tag]
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Create the release (no assets)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: ${{ contains(env.TAG_NAME, '-') }}

  # ──────────────────────────────────────────────────────────────────
  # GATE 2 — single-file binaries for 6 RIDs, SBOMs and checksums.
  # Read-only; upload-assets attaches them to the release.
  # ──────────────────────────────────────────────────────────────────
  publish:
    name: publish ${{ matrix.rid }}
    needs: [ci-mirror, validate-tag]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-4vcpu-ubuntu-2404,  rid: linux-x64,   archive: tar.gz }
          - { os: blacksmith-4vcpu-ubuntu-2404,  rid: linux-arm64, archive: tar.gz }
          - { os: blacksmith-4vcpu-windows-2025, rid: win-x64,     archive: zip }
          - { os: blacksmith-4vcpu-windows-2025, rid: win-arm64,   archive: zip }
          - { os: blacksmith-6vcpu-macos-latest, rid: osx-x64,     archive: tar.gz }
          - { os: blacksmith-6vcpu-macos-latest, rid: osx-arm64,   archive: tar.gz }
    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME: ${{ needs.validate-tag.outputs.tag }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish single-file
        run: |
          set -euo pipefail
          dotnet publish src/NutanixMcp.Cli/NutanixMcp.Cli.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:Version="${TAG_NAME#v}" \
            --output "publish/$RID"

      - name: Stage release artefacts
        run: |
          set -euo pipefail
          stage="stage/nutanix-mcp-$TAG_NAME-$RID"
          mkdir -p "$stage"
          cp -r "publish/$RID/." "$stage/"
          cp README.md README.ru.md LICENSE CHANGELOG.md "$stage/" 2>/dev/null || true
          mkdir -p "$stage/docs" "$stage/deploy" "$stage/scripts" "$stage/docker"
          cp -r docs/. "$stage/docs/" 2>/dev/null || true
          cp -r deploy/. "$stage/deploy/" 2>/dev/null || true
          # init.sql is needed by `nutanix-mcp bootstrap --skip-restore`
          # (manual ingest path, no dump). LocateInitSql walks up from the
          # binary so docker/init.sql alongside the staged tree is found.
          cp docker/init.sql "$stage/docker/" 2>/dev/null || true
          # Only ship cross-platform helper scripts in the bundle.
          cp scripts/fetch-models.ps1 "$stage/scripts/" 2>/dev/null || true
          # install.sh drives the one-command end-user path referenced by
          # README.md / docs/en/quickstart.md.
          cp scripts/install.sh "$stage/scripts/" 2>/dev/null || true
          chmod +x "$stage/scripts/install.sh" 2>/dev/null || true

      # ── SBOMs (CycloneDX + SPDX JSON) for the staged artefact ──
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          base="nutanix-mcp-$TAG_NAME-$RID"
          syft "stage/$base" \
            --output "cyclonedx-json=$base.sbom.cdx.json" \
            --output "spdx-json=$base.sbom.spdx.json"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          archive="nutanix-mcp-$TAG_NAME-$RID.tar.gz"
          (cd stage && tar -czf "../$archive" "nutanix-mcp-$TAG_NAME-$RID")
          if command -v sha256sum >/dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi > "$archive.sha256"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name    = "nutanix-mcp-$env:TAG_NAME-$env:RID"
          $archive = "$name.zip"
          Compress-Archive -Path "stage/$name" -DestinationPath $archive
          Get-FileHash $archive -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $archive" } |
            Set-Content "$archive.sha256"

      - name: Keep artefacts for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: |
            nutanix-mcp-*.tar.gz
            nutanix-mcp-*.tar.gz.sha256
            nutanix-mcp-*.zip
            nutanix-mcp-*.zip.sha256
            nutanix-mcp-*.sbom.*.json
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Attach the six archives to the release in one place.
  # ──────────────────────────────────────────────────────────────────
  upload-assets:
    name: upload release assets
    needs: [validate-tag, create-release, publish]
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: ${{ contains(env.TAG_NAME, '-') }}
          files: dist/*

  # ──────────────────────────────────────────────────────────────────
  # Pull-request dry run of the image build: same builder and inputs as
  # `container`, but read-only and never pushed.
  # ──────────────────────────────────────────────────────────────────
  container-verify:
    name: container (dry run)
    needs: [ci-mirror, validate-tag]
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: nutanix-mcp-containerfile-app
      - name: Build (no push)
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: docker/Containerfile.app
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}

  # ──────────────────────────────────────────────────────────────────
  # GATE 3 — multi-arch container image, signed with cosign keyless,
  # pushed to GHCR. Image SBOMs attached to the release.
  #
  # No QEMU: the build stage runs on $BUILDPLATFORM and cross-publishes,
  # and the runtime stage only copies files, so no instruction executes
  # under the target architecture.
  # ──────────────────────────────────────────────────────────────────
  container:
    name: container
    needs: [ci-mirror, validate-tag, create-release]
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write   # required so softprops/action-gh-release can attach the image SBOM
      packages: write
      id-token: write
    env:
      TAG_NAME: ${{ needs.validate-tag.outputs.tag }}
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: nutanix-mcp-containerfile-app

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.TAG_NAME }}
            type=raw,value=latest,enable=${{ !contains(env.TAG_NAME, '-') }}

      - name: Build and push
        id: build
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: docker/Containerfile.app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v3.1.3 fixes GHSA-fx35-mq7g-6g98; the installer default is v3.0.6.
          cosign-release: v3.1.3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Generate image SBOMs
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          syft "$IMAGE" \
            --output "cyclonedx-json=image-sbom.cdx.json" \
            --output "spdx-json=image-sbom.spdx.json"

      - name: Upload image SBOMs to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            image-sbom.cdx.json
            image-sbom.spdx.json

  # ──────────────────────────────────────────────────────────────────
  # Corpus dump bring-forward.
  #
  # The full Nutanix corpus requires a populated PG with the docs
  # ingested (~25 min, models + source PDFs); we can't regenerate from
  # CI. Instead, copy the most recent previous release's
  # nutanix-corpus-*.dump into this release so every tag has a usable
  # restore asset that `nutanix-mcp bootstrap --release <tag>` can
  # consume directly.
  #
  # Idempotent: skips if the new release already has the asset (e.g.
  # the operator pre-uploaded a fresh dump from a host where the corpus
  # was just re-ingested).
  # ──────────────────────────────────────────────────────────────────
  corpus-dump:
    name: corpus dump
    needs: [validate-tag, upload-assets]
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.validate-tag.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Bring-forward last release's corpus dump
        run: |
          set -euo pipefail

          asset="nutanix-corpus-${TAG_NAME}.dump"
          repo="$REPO"
          mkdir -p _carry

          # Skip if the new release already has the asset (someone
          # pre-uploaded a fresh dump before/after tagging).
          existing="$(gh release view "$TAG_NAME" -R "$repo" \
            --json assets --jq ".assets[] | select(.name == \"$asset\") | .name" \
            2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "release $TAG_NAME already has $asset — nothing to bring forward."
            exit 0
          fi

          # Find the most recent release that has any nutanix-corpus-*.dump.
          # Filter out the current tag so we don't try to copy from itself.
          src_tag="$(gh release list -R "$repo" --limit 30 \
            --json tagName --jq '.[].tagName' \
            | while read -r t; do
                [ "$t" = "$TAG_NAME" ] && continue
                has="$(gh release view "$t" -R "$repo" \
                  --json assets \
                  --jq '.assets[] | select(.name | startswith("nutanix-corpus-") and endswith(".dump")) | .name' \
                  2>/dev/null | head -n1 || true)"
                if [ -n "$has" ]; then
                  printf '%s\t%s\n' "$t" "$has"
                  break
                fi
              done)"

          if [ -z "$src_tag" ]; then
            echo "no previous release carries a nutanix-corpus-*.dump — nothing to do."
            exit 0
          fi

          src_release="$(printf '%s' "$src_tag" | cut -f1)"
          src_asset="$(printf '%s' "$src_tag" | cut -f2)"
          echo "carrying forward $src_asset from $src_release -> $asset on $TAG_NAME"

          gh release download "$src_release" -R "$repo" \
            -p "$src_asset" -p "${src_asset}.sha256" -D _carry

          mv "_carry/$src_asset" "_carry/$asset"
          if [ -f "_carry/${src_asset}.sha256" ]; then
            # Rewrite the filename column inside the sha256 file.
            old_sha="$(awk '{print $1}' "_carry/${src_asset}.sha256")"
            printf '%s  %s\n' "$old_sha" "$asset" > "_carry/${asset}.sha256"
            rm -f "_carry/${src_asset}.sha256"
          fi

          files=("_carry/$asset")
          if [ -f "_carry/${asset}.sha256" ]; then
            files+=("_carry/${asset}.sha256")
          fi
          gh release upload "$TAG_NAME" -R "$repo" --clobber "${files[@]}"

  # ──────────────────────────────────────────────────────────────────
  # Extract the [<tag>] block from CHANGELOG.md as release notes.
  # Runs last so it overwrites whatever softprops/action-gh-release
  # auto-generated.
  # ──────────────────────────────────────────────────────────────────
  finalize:
    name: finalize release notes
    needs: [upload-assets, container, corpus-dump, validate-tag]
    if: always() && github.event_name != 'pull_request' && needs.upload-assets.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.validate-tag.outputs.tag }}
      VERSION: ${{ needs.validate-tag.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes
        run: |
          set -euo pipefail
          # awk: collect lines between `## [<version>]` and the next
          # `## [` heading (or the link-reference block at file end).
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") found=1
              next
            }
            /^\[.+\]:/ && found { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            {
              echo "## What's Changed"
              echo
              echo "See [CHANGELOG.md](https://github.com/${REPO}/blob/main/CHANGELOG.md) for details."
            } > release-notes.md
          fi
          echo "── release notes ──"
          cat release-notes.md
          echo "──────────────────"

      - name: Update release
        run: gh release edit "$TAG_NAME" -R "$REPO" --notes-file release-notes.md
