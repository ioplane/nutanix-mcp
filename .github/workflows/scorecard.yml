name: scorecard

# OpenSSF Scorecard — supply-chain-security posture audit. Runs weekly
# (Tuesday 07:30 UTC) and on every push to main; results surface in the
# repo's Security tab and on https://securityscorecards.dev/ for the
# public badge.
#
# Why a separate workflow: Scorecard wants its own permissions block
# (id-token: write for the public badge, security-events: write for SARIF)
# and a clean trigger surface so weekly runs don't fight CI concurrency.
# With publish_results the Scorecard API also rejects workflows that carry
# top-level `env`/`defaults` or job containers/services, and only accepts
# steps from its approved action list (harden-runner is on it).

on:
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Scorecard's public-results path requires a public repo; on private
    # repos the action errors out with "Resource not accessible by
    # integration" because GITHUB_TOKEN can't reach the public Scorecard
    # GraphQL surface. Skip cleanly on private; the job auto-enables the
    # day the repo goes public.
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results=true requires a public repo; the action
          # gracefully no-ops on private repos, so it's safe to leave on.
          publish_results: true

      - name: Upload artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
