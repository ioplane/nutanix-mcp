name: scorecard

# OpenSSF Scorecard — supply-chain-security posture audit. Runs weekly
# (Tuesday 07:30 UTC) and on every push to main; results surface in the
# repo's Security tab and on https://securityscorecards.dev/ for the
# public badge.
#
# Why a separate workflow: Scorecard wants its own permissions block
# (id-token: write for the public badge, security-events: write for SARIF)
# and a clean trigger surface so weekly runs don't fight CI concurrency.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 7 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard's public-results path requires a public repo; on private
    # repos the action errors out with "Resource not accessible by
    # integration" because GITHUB_TOKEN can't reach the public Scorecard
    # GraphQL surface. Skip cleanly on private; the job auto-enables the
    # day the repo goes public.
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results=true requires a public repo; the action
          # gracefully no-ops on private repos, so it's safe to leave on.
          publish_results: true

      - name: Upload artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
