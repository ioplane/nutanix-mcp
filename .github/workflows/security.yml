name: security

# CodeQL + Semgrep + dependency review for the .NET tree.
# Runs on every push/PR to main and on a weekly schedule (Monday 06:00 UTC)
# so a freshly-published CVE is caught even when the codebase is quiet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (csharp)
    runs-on: ubuntu-latest
    # CodeQL upload-sarif targets the GitHub Code Scanning surface,
    # which is GHAS-gated on private repos. Skip cleanly until the
    # repo is public (or GHAS is provisioned).
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  semgrep:
    name: Semgrep (auto + p/security-audit)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      # Two-mode: always run a blocking scan (`--error` fails the job on
      # any P0/P1 finding, regardless of repo visibility); separately
      # produce a SARIF that we only upload to Code Scanning on public
      # repos (private repos need GHAS for the upload-sarif endpoint).
      - name: Run Semgrep (blocking)
        run: |
          semgrep scan \
            --config=auto \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --no-git-ignore \
            --include='*.cs' \
            --include='*.py' \
            --include='*.sh' \
            --include='*.ps1' \
            --include='*.yml' \
            --exclude='**/obj/**' \
            --exclude='**/bin/**' \
            --exclude='**/Migrations/*.Designer.cs' \
            --exclude='**/Migrations/*.cs' \
            --sarif --output=semgrep.sarif

      - name: Upload SARIF
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload SARIF as artefact (private repo fallback)
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true
