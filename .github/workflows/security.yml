name: security

# CodeQL + Semgrep for the .NET tree.
# Runs on every push/PR to main and on a weekly schedule (Monday 06:00 UTC)
# so a freshly-published CVE is caught even when the codebase is quiet.
#
# Dependency scanning of NuGet deps is covered by the inline `NuGetAudit`
# in Directory.Build.props (Mode=all, Level=moderate) which fires on every
# build — including in this workflow's CodeQL build step. The previous
# `dependency-review` job using `actions/dependency-review-action@v4` was
# removed because the action requires GitHub's Dependency Graph feature,
# which is not available for this personal-account repository — it always
# returned "Dependency review is not supported on this repository" with
# exit 1, blocking every PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  codeql:
    name: CodeQL (csharp)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # CodeQL upload-sarif targets the GitHub Code Scanning surface,
    # which is GHAS-gated on private repos. Skip cleanly until the
    # repo is public (or GHAS is provisioned).
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Manual build mode: autobuild could not pick a build method for this
      # solution ("Could not auto-detect a suitable build method"); an explicit
      # build is also the most precise mode for compiled languages.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: csharp
          build-mode: manual
          queries: +security-and-quality

      - name: Build
        run: dotnet build nutanix-mcp.slnx --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:csharp"

  semgrep:
    name: Semgrep (auto + p/security-audit)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      security-events: write
      contents: read
    container:
      # Digest-pinned semgrep/semgrep 1.180.0 (resolved 2026-10). Bump the digest
      # deliberately rather than tracking a moving :latest tag.
      image: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two-mode: always run a blocking scan (`--error` fails the job on
      # any P0/P1 finding, regardless of repo visibility); separately
      # produce a SARIF that we only upload to Code Scanning on public
      # repos (private repos need GHAS for the upload-sarif endpoint).
      - name: Run Semgrep (blocking)
        run: |
          semgrep scan \
            --config=auto \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --no-git-ignore \
            --include='*.cs' \
            --include='*.py' \
            --include='*.sh' \
            --include='*.ps1' \
            --include='*.yml' \
            --exclude='**/obj/**' \
            --exclude='**/bin/**' \
            --exclude='**/Migrations/*.Designer.cs' \
            --exclude='**/Migrations/*.cs' \
            --sarif --output=semgrep.sarif

      - name: Upload SARIF
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload SARIF as artefact (private repo fallback)
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14
