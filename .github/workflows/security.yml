name: security

# CodeQL + Semgrep for the .NET tree.
# Runs on every push/PR to main and on a weekly schedule (Monday 06:00 UTC)
# so a freshly-published CVE is caught even when the codebase is quiet.
#
# Dependency scanning of NuGet deps is covered by the inline `NuGetAudit`
# in Directory.Build.props (Mode=all, Level=moderate) which fires on every
# build — including in this workflow's CodeQL Autobuild stage. The previous
# `dependency-review` job using `actions/dependency-review-action@v4` was
# removed because the action requires GitHub's Dependency Graph feature,
# which is not available for this personal-account repository — it always
# returned "Dependency review is not supported on this repository" with
# exit 1, blocking every PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (csharp)
    runs-on: ubuntu-latest
    # CodeQL upload-sarif targets the GitHub Code Scanning surface,
    # which is GHAS-gated on private repos. Skip cleanly until the
    # repo is public (or GHAS is provisioned).
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          languages: csharp
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          category: "/language:csharp"

  semgrep:
    name: Semgrep (auto + p/security-audit)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Two-mode: always run a blocking scan (`--error` fails the job on
      # any P0/P1 finding, regardless of repo visibility); separately
      # produce a SARIF that we only upload to Code Scanning on public
      # repos (private repos need GHAS for the upload-sarif endpoint).
      - name: Run Semgrep (blocking)
        run: |
          semgrep scan \
            --config=auto \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --no-git-ignore \
            --include='*.cs' \
            --include='*.py' \
            --include='*.sh' \
            --include='*.ps1' \
            --include='*.yml' \
            --exclude='**/obj/**' \
            --exclude='**/bin/**' \
            --exclude='**/Migrations/*.Designer.cs' \
            --exclude='**/Migrations/*.cs' \
            --sarif --output=semgrep.sarif

      - name: Upload SARIF
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload SARIF as artefact (private repo fallback)
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14
